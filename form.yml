---
cluster: "tillicum"

attributes:
  auto_qos:
    value: "normal"
  num_gpus:
    widget: "hidden_field"
    label: "Number of GPUs"
    required: true
    min: 1
    max: 1
    step: 1
    value: 1
    display: false
    help: |
      The request always uses 1 GPU by default; changing this field does
      not change the GPU request. Place holder in case we want to explore multi-GPU models in the future.
  bc_num_hours:
    value: 4
    display: true
  sif_path:
    label: "Apptainer Image Path"
    widget: "hidden_field"
    value: "/gpfs/containers/llama.cpp/llama.cpp_full-cuda13.sif"
    help: |
      Full path to the llama.cpp Apptainer image (.sif file).
      Must be readable from the compute nodes.
      (Hidden — managed by the application administrator.)
  model_path:
    label: "Model"
    widget: "select"
    required: true
    value: ""
    options:
      - ["Alibaba Qwen3.8 (27B-bf16)", "/gpfs/models/Qwen3.8-27B.gguf", {data-partition: "gpu-h200", data-option-for-gpu-partition-gpu-h200-mig: false}]
      - ["NVIDIA Nemotron-3.5-Lightning (30B-A3B-bf16)", "/gpfs/models/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16.gguf", {data-partition: "gpu-h200", data-option-for-gpu-partition-gpu-h200-mig: false}]
      - ["Google Gemma-4 (31B-it-bf16)", "/gpfs/models/gemma-4-31B-it-GGUF/BF16/gemma-4-31B-it-BF16-00001-of-00002.gguf", {data-partition: "gpu-h200", data-option-for-gpu-partition-gpu-h200-mig: false}]
      - ["Meta Muse-Glimmer (30B-fp4)", "/gpfs/models/Muse-Glimmer-30B-GGUF/Muse-Glimmer-30B-KQuant-Dynamic-Q4_K_XL.gguf", {data-partition: "gpu-h200", data-option-for-gpu-partition-gpu-h200-mig: false}]
      - ["OpenBMB MiniCPM (2B-fp16)", "/gpfs/models/MiniCPM5-2B-GGUF/MiniCPM5-2B-F16.gguf", {data-partition: "gpu-h200-mig", data-option-for-gpu-partition-gpu-h200: false}]
      - ["Alibaba Qwen3.5 (2B-bf16)", "/gpfs/models/Qwen3.5-2B.gguf", {data-partition: "gpu-h200-mig", data-option-for-gpu-partition-gpu-h200: false}]
      - ["Alibaba Qwen3.5 (4B-bf16)", "/gpfs/models/Qwen3.5-4B.gguf", {disabled: true, data-model-placeholder: true, data-partition: "gpu-h200-mig", data-option-for-gpu-partition-gpu-h200: false}]
      - ["Alibaba Qwen3.5 (9B-bf16)", "/gpfs/models/Qwen3.5-9B.gguf", {disabled: true, data-model-placeholder: true, data-partition: "gpu-h200-mig", data-option-for-gpu-partition-gpu-h200: false}]
      - ["Google Gemma-4 (31B-it-UD-IQ3_XXS)", "/gpfs/models/gemma-4-31B-it-GGUF/gemma-4-31B-it-UD-IQ3_XXS.gguf", {disabled: true, data-model-placeholder: true, data-partition: "gpu-h200-mig", data-option-for-gpu-partition-gpu-h200: false}]
    help: |
      Models are filtered by partition because the available GPU memory differs.
      The full on-disk GGUF path is selected automatically for each model. 
  gpu_partition:
    label: "Partition"
    widget: "select"
    value: "gpu-h200"
    options:
      - ["gpu-h200", "gpu-h200"]
      - ["gpu-h200-mig", "gpu-h200-mig"]
    help: |
      Slurm partition to request the GPU allocation from.
  temperature:
    label: "Temperature"
    widget: "number_field"
    min: 0
    max: 1
    step: 0.01
    value: 0.8
    help: |
      Sampling temperature for the model (0.00 to 1.00).
      Lower is more deterministic, higher is more creative.
  api_key:
    label: "API Key (optional)"
    widget: "hidden_field"
    value: ""
    display: false
    help: |
      If set, the server requires this key (Authorization: Bearer ...)
      for API calls. The Web UI lets you enter it under Settings.
      Leave empty for no authentication.
  extra_llama_args:
    label: "Extra llama-server arguments"
    widget: "text_field"
    value: "--jinja --webui-mcp-proxy"
    help: |
      <a href="https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md">Additional arguments</a> passed to the llama.cpp server. You need the --jinja flag if you want to enable tool calling. Recommended to add flags, if necessary, instead of removing.
  enable_advanced_args:
    label: Explore advanced options?
    widget: "check_box"
    html_options:
      data:
        hide-temperature-when-un-checked: true
        hide-extra-llama-args-when-un-checked: true
        hide-extra-slurm-args-when-un-checked: true
  extra_slurm_args:
    label: Extra Slurm options
    widget: "text_field"
    help: Additional arguments for the Slurm command, e.g. "sbatch --custom-options"
  storage_yolo:
    label: "YOLO"
    widget: "check_box"
    value: "1"
    header: |
      **Security: File Access**
    help: |
      If checked, the container is run as currently configured with broad mounts. Most AI models run commands as you do and therefore have access to the same files by default.
      It is recommended to uncheck this box and selectively mount paths to limit potential damage a model may be allowed to cause.
    html_options:
      data:
        hide-storage-home-mount-when-checked: true
        hide-mount1-source-when-checked: true
        hide-mount1-dest-when-checked: true
        hide-mount1-writable-when-checked: true
        hide-mount2-source-when-checked: true
        hide-mount2-dest-when-checked: true
        hide-mount2-writable-when-checked: true
        hide-mount3-source-when-checked: true
        hide-mount3-dest-when-checked: true
        hide-mount3-writable-when-checked: true
  storage_home_mount:
    label: "Mount home directory?"
    widget: "check_box"
    value: "0"
    help: |
      When checked, your Tillicum home directory (i.e., `/gpfs/home/$USER`) is bind-mounted into the container as `/home/$USER`. If unchecked, your ephemeral home directory is empty and internal to the container at `/home/$USER`.
  mount1_source:
    label: "Source (Tillicum)"
    widget: "text_field"
  mount1_dest:
    label: "Destination (Container)"
    widget: "text_field"
  mount1_writable:
    label: "Writable?"
    widget: "check_box"
    value: "0"
  mount2_source:
    label: ""
    widget: "text_field"
  mount2_dest:
    label: ""
    widget: "text_field"
  mount2_writable:
    label: ""
    widget: "check_box"
    value: "0"
  mount3_source:
    label: ""
    widget: "text_field"
  mount3_dest:
    label: ""
    widget: "text_field"
  mount3_writable:
    label: ""
    widget: "check_box"
    value: "0"

form:
  - auto_accounts
  - auto_qos
  - num_gpus
  - gpu_partition
  - bc_num_hours
  - sif_path
  - model_path
  - enable_advanced_args
  - temperature
  - api_key
  - extra_llama_args
  - extra_slurm_args
  - storage_yolo
  - storage_home_mount
  - mount1_source
  - mount1_dest
  - mount1_writable
  - mount2_source
  - mount2_dest
  - mount2_writable
  - mount3_source
  - mount3_dest
  - mount3_writable
